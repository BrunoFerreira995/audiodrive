name: AU validation
on:
  workflow_dispatch:
jobs:
  auval:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build AU
        run: |
          cmake -S . -B build-au -DCMAKE_BUILD_TYPE=Release -DAUDIO32_BUILD_AU_PLUGIN=ON
          cmake --build build-au --target Audio32Plugin_AU --parallel 4
      - name: Run auval
        run: |
          COMPONENT=$(find build-au -name "*.component" | head -1)
          if [ -n "$COMPONENT" ] && command -v auval >/dev/null 2>&1; then
            auval -v aufx Au32 A032 "$COMPONENT"
          else
            echo "auval not available or component missing"
            exit 0
          fi
