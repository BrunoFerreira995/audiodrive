name: Plugin Release
on:
  workflow_dispatch:
jobs:
  build-au:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AU and VST3
        run: |
          cmake -S . -B build-au -DCMAKE_BUILD_TYPE=Release -DAUDIO32_BUILD_AU_PLUGIN=ON
          cmake --build build-au --target Audio32Plugin_AU Audio32Plugin_VST3 audio32_au_host_tests --parallel 4
      - name: Run AU host tests
        run: ctest --test-dir build-au -R au_host --output-on-failure
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Audio32Plugin
          path: |
            build-au/plugins/Audio32Plugin_artefacts/Release/AU/
            build-au/plugins/Audio32Plugin_artefacts/Release/VST3/
